/* 🎬 Movie-style responsive slider */
.slider {
  position: relative;
  width: 100%;
  height: 60vh; /* Responsive height */
  max-height: 60px;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
}

/* Common image styling */
.slider img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  animation-duration: 24s;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}

/* Each image animation direction */
.from-left { animation-name: slideFromLeft; }
.from-right { animation-name: slideFromRight; }
.from-top { animation-name: slideFromTop; }
.from-bottom { animation-name: slideFromBottom; }

/* Animations for different entry directions */
@keyframes slideFromLeft {
  0% { transform: translateX(-100%); opacity: 0; }
  5%, 25% { transform: translateX(0); opacity: 1; }
  30%, 100% { opacity: 0; }
}

@keyframes slideFromRight {
  25% { transform: translateX(100%); opacity: 0; }
  30%, 50% { transform: translateX(0); opacity: 1; }
  55%, 100% { opacity: 0; }
}

@keyframes slideFromTop {
  50% { transform: translateY(-100%); opacity: 0; }
  55%, 75% { transform: translateY(0); opacity: 1; }
  80%, 100% { opacity: 0; }
}

@keyframes slideFromBottom {
  75% { transform: translateY(100%); opacity: 0; }
  80%, 100% { transform: translateY(0); opacity: 1; }
}

/* 🔁 Smooth fade-in/out transition */
@keyframes slideIn {
  0% { opacity: 0; }
  100% { opacity: 1; }
}

/* 📱 Mobile responsiveness */
@media (max-width: 768px) {
  .slider {
    height: 40vh; /* smaller on mobile */
  }

  .slider img {
    object-fit: cover;
  }
}

/* 📲 Smaller phones */
@media (max-width: 480px) {
  .slider {
    height: 35vh;
  }
}
